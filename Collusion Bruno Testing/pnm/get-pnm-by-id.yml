info:
  name: get-pnm-by-id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/{{pnmId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("response has info object", function() {
          expect(res.body).to.have.property("info");
        });

        test("info has required fields", function() {
          expect(res.body.info).to.have.property("first_name");
          expect(res.body.info).to.have.property("last_name");
          expect(res.body.info).to.have.property("email");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
