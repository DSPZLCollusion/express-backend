info:
  name: get-all-pnms
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("response is an array", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
