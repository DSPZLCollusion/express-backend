info:
  name: delete-pnm
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/{{pnmId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("response contains deleted id", function() {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
