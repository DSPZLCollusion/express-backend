info:
  name: update-pnm-not-found
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/999999"
  body:
    type: json
    data: |-
      {
        "info": {
          "first_name": "Jane",
          "last_name": "Doe",
          "email": "jane.doe@example.com",
          "phone_number": "5025550101",
          "class_year": "FRESHMAN"
        },
        "on_campus": {
          "dorm": "SPEED",
          "room_number": "101"
        },
        "off_campus": null,
        "interests": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });

        test("body has error message", function() {
          expect(res.body.error).to.equal("PNM not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
