info:
  name: delete-pnm-not-found
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/999999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });

        test("body has error message", function() {
          expect(res.body.error).to.equal("PNM not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
