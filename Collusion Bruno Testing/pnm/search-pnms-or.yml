info:
  name: search-pnms-or
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/searchOr"
  params:
    - name: class_year
      value: FRESHMAN
    - name: dorm
      value: SPEED
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("response is an array", function() {
          expect(res.body).to.be.an("array");
        });

        test("each result matches at least one filter", function() {
          res.body.forEach(function(pnm) {
            var matchesClass = pnm.class_year === "FRESHMAN";
            var matchesDorm  = pnm.dorm === "SPEED";
            expect(matchesClass || matchesDorm).to.be.true;
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
