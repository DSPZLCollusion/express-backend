info:
  name: create-pnm
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}"
  body:
    type: json
    data: |-
      {
        "info": {
          "first_name": "Jane",
          "last_name": "Doe",
          "email": "jane.doe@example.com",
          "phone_number": "5025550101",
          "class_year": "FRESHMAN"
        },
        "on_campus": {
          "dorm": "SPEED",
          "room_number": "101"
        },
        "off_campus": null,
        "interests": ["Soccer", "Music"]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });

        test("response contains new id", function() {
          expect(res.body).to.have.property("id");
          bru.setVar("pnmId", res.body.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
