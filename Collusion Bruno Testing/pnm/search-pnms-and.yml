info:
  name: search-pnms-and
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/searchAnd"
  params:
    - name: class_year
      value: FRESHMAN
    - name: dorm
      value: SPEED
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("response is an array", function() {
          expect(res.body).to.be.an("array");
        });

        test("all results match both filters", function() {
          res.body.forEach(function(pnm) {
            expect(pnm.class_year).to.equal("FRESHMAN");
            expect(pnm.dorm).to.equal("SPEED");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
